name = "mayrain-guestbook"
main = "worker.js"
compatibility_date = "2026-11-16"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "GUESTBOOK"
id = "e300bd45484b4c78894181789e164d45"

[[d1_databases]]
binding = "DB"
database_name = "mayrain-accounts"
database_id = "ebb58452-72ce-4f83-8d2b-c221b20a8d8f"
migrations_dir = "migrations"

[vars]
SITE_ORIGIN = "https://mayrain.me"
MAIL_FROM = "MayRain <noreply@mayrain.me>"

[[routes]]
pattern = "mayrain.me/api/*"
zone_name = "mayrain.me"

[[routes]]
pattern = "mayrain.me/auth/*"
zone_name = "mayrain.me"
